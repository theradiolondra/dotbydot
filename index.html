<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Directional Dot-to-Dot Generator</title>
    <!-- jsPDF Bibliothek für saubere Vektor-PDFs direkt im Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #f4f4f4;
            color: #111;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border: 2px solid #111;
            background: #fff;
        }
        h2 { margin-top: 0; font-size: 1.4rem; letter-spacing: -0.5px; }
        .dropzone {
            border: 2px dashed #111;
            padding: 40px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .dropzone:hover { background: #f0f0f0; }
        button {
            background: #E60000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            display: none;
        }
        button:hover { background: #cc0000; }
        #status { font-family: monospace; margin-top: 15px; font-size: 0.9rem; }
        canvas { border: 1px solid #ddd; margin-top: 20px; max-width: 100%; display: none; background: #fff; }
    </style>
</head>
<body>

    <h2>Directional Dot-to-Dot Converter (PDF)</h2>
    <p>Ziehe deine FiniteCurve-SVG hierher oder klicke, um sie auszuwählen:</p>

    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <span id="dropText">SVG-Datei hier ablegen (.svg)</span>
        <input type="file" id="fileInput" accept=".svg" style="display: none;">
    </div>

    <div id="status"></div>
    <button id="downloadBtn">⬇ DRUCKREIFE PDF HERUNTERLADEN</button>
    <br>
    <canvas id="previewCanvas"></canvas>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        let globalFilteredPoints = [];
        let globalBounds = null;
        let originalFileName = "puzzle";

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#e2e2e2'; });
        dropzone.addEventListener('dragleave', () => { dropzone.style.background = '#fafafa'; });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.style.background = '#fafafa';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            originalFileName = file.name.replace(/\.[^/.]+$/, "");
            status.textContent = `Lese "${file.name}" ein...`;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    processSVG(e.target.result);
                    status.textContent = `Erfolgreich! ${globalFilteredPoints.length} Punkte extrahiert.`;
                    downloadBtn.style.display = 'inline-block';
                } catch (err) {
                    status.textContent = "Fehler beim Verarbeiten: " + err.message;
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function processSVG(svgText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgText, "image/svg+xml");
            
            let rawPoints = [];
            
            // Exakte Vektor-Extraktion wie im funktionierenden Python-Skript
            doc.querySelectorAll('path, polyline, line, polygon').forEach(el => {
                let d = el.getAttribute('d') || el.getAttribute('points') || '';
                let nums = d.match(/[-+]?[0-9]*\.?[0-9]+/g);
                if (nums && nums.length >= 4) {
                    let floats = nums.map(Number);
                    for (let i = 0; i < floats.length - 1; i += 2) {
                        rawPoints.push({ x: floats[i], y: floats[i+1] });
                    }
                }
            });

            if (rawPoints.length < 5) throw new Error("Keine ausreichenden Pfade in der SVG gefunden.");

            // Exakter Eck- und Kurvenfilter (min_dist_px = 12, min_angle = 8°)
            let filtered = [rawPoints[0]];
            let lastIdx = 0;
            const minAngleDeg = 8.0;
            const minDist = 12.0;

            for (let i = 1; i < rawPoints.length - 1; i++) {
                let dx = rawPoints[i].x - rawPoints[lastIdx].x;
                let dy = rawPoints[i].y - rawPoints[lastIdx].y;
                let dist = Math.hypot(dx, dy);

                if (dist < minDist) continue;

                let nx = rawPoints[i+1].x - rawPoints[i].x;
                let ny = rawPoints[i+1].y - rawPoints[i].y;
                let normPrev = Math.hypot(dx, dy);
                let normNext = Math.hypot(nx, ny);

                if (normPrev > 0.001 && normNext > 0.001) {
                    let cosVal = Math.max(-1, Math.min(1, (dx * nx + dy * ny) / (normPrev * normNext)));
                    let angle = Math.acos(cosVal) * (180 / Math.PI);

                    if (angle >= minAngleDeg || dist >= minDist * 2.0) {
                        filtered.push(rawPoints[i]);
                        lastIdx = i;
                    }
                }
            }
            filtered.push(rawPoints[rawPoints.length - 1]);
            globalFilteredPoints = filtered;

            // Bounding Box
            let xs = filtered.map(p => p.x);
            let ys = filtered.map(p => p.y);
            let minX = Math.min(...xs), maxX = Math.max(...xs);
            let minY = Math.min(...ys), maxY = Math.max(...ys);
            let w = maxX - minX || 1, h = maxY - minY || 1;
            globalBounds = { minX, minY, w, h };

            // Vorschau auf Canvas zeichnen
            canvas.width = 600;
            canvas.height = (h / w) * 600;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const scale = canvas.width / w;
            const offsetX = -minX;
            const offsetY = -minY;

            function trans(p) {
                return { x: (p.x + offsetX) * scale, y: (p.y + offsetY) * scale };
            }

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.0;
            ctx.fillStyle = "#000";

            for (let i = 0; i < filtered.length - 1; i++) {
                let p1 = trans(filtered[i]);
                
                // Richtungsstrich (Ultrakurz für Inkjet)
                let vx = filtered[i+1].x - filtered[i].x;
                let vy = filtered[i+1].y - filtered[i].y;
                let len = Math.hypot(vx, vy) || 1;
                let ux = vx / len, uy = vy / len;

                let tickLen = 5.0; // Kurzer Strich
                let tEnd = { x: filtered[i].x + ux * tickLen, y: filtered[i].y + uy * tickLen };
                let pTickEnd = trans(tEnd);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(pTickEnd.x, pTickEnd.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, 2.0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Roter Startpunkt
            let pStart = trans(filtered[0]);
            ctx.fillStyle = "#E60000";
            ctx.beginPath();
            ctx.arc(pStart.x, pStart.y, 4, 0, Math.PI * 2);
            ctx.fill();

            canvas.style.display = 'block';
        }

        downloadBtn.onclick = function() {
            if (!globalFilteredPoints.length) return;

            const { jsPDF } = window.jspdf;
            
            // Definiere Druckformat: 12 Zoll Breite im Verhältnis
            let baseWidthInches = 12.0;
            let aspect = globalBounds.h / globalBounds.w;
            let baseHeightInches = baseWidthInches * aspect;

            const pdf = new jsPDF({
                orientation: baseWidthInches > baseHeightInches ? 'l' : 'p',
                unit: 'in',
                format: [baseWidthInches, baseHeightInches]
            });

            pdf.setFillColor(255, 255, 255);
            pdf.rect(0, 0, baseWidthInches, baseHeightInches, 'F');

            let margin = baseWidthInches * 0.025;
            let drawW = baseWidthInches - (margin * 2);
            let drawH = baseHeightInches - (margin * 2);

            let scaleX = drawW / globalBounds.w;
            let scaleY = drawH / globalBounds.h;
            let scale = Math.min(scaleX, scaleY);

            function pdfTrans(p) {
                return {
                    x: margin + (p.x - globalBounds.minX) * scale,
                    y: margin + (p.y - globalBounds.minY) * scale
                };
            }

            // Zeichne Richtungsstriche ins PDF
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.007); // ca. 0.5 pt Strichstärke

            for (let i = 0; i < globalFilteredPoints.length - 1; i++) {
                let p1 = pdfTrans(globalFilteredPoints[i]);

                let vx = globalFilteredPoints[i+1].x - globalFilteredPoints[i].x;
                let vy = globalFilteredPoints[i+1].y - globalFilteredPoints[i].y;
                let len = Math.hypot(vx, vy) || 1;
                let ux = vx / len, uy = vy / len;

                // Skaliere Strichlänge passend für Zoll-PDF (ca. 0.04 Zoll = ~3pt)
                let tickLen = 0.04;
                let tEnd = { 
                    x: globalFilteredPoints[i].x + ux * (tickLen * (globalBounds.w / drawW)), 
                    y: globalFilteredPoints[i].y + uy * (tickLen * (globalBounds.h / drawH)) 
                };
                let p2 = pdfTrans(tEnd);

                pdf.line(p1.x, p1.y, p2.x, p2.y);
            }

            // Zeichne reguläre Punkte (Schwarz)
            pdf.setFillColor(0, 0, 0);
            for (let i = 1; i < globalFilteredPoints.length; i++) {
                let pt = pdfTrans(globalFilteredPoints[i]);
                pdf.circle(pt.x, pt.y, 0.015, 'F'); // ca. 2.1 pt Radius
            }

            // Zeichne Startpunkt (Rot)
            pdf.setFillColor(230, 0, 0);
            let startPt = pdfTrans(globalFilteredPoints[0]);
            pdf.circle(startPt.x, startPt.y, 0.035, 'F'); // Größerer roter Startpunkt

            pdf.save(originalFileName + "_inkjet_ticks.pdf");
        };
    </script>

</body>
</html>
